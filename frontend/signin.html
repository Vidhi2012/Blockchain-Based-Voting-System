<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — ChainSankalp</title>
  <link rel="stylesheet" href="css/auth.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- top bar -->
  <div class="auth-topbar">
    <a href="index.html" class="auth-logo">⛓ ChainSankalp</a>
    <a href="signup.html" class="auth-topbar-link">New here? Create account →</a>
  </div>

  <div class="auth-container">

    <div class="auth-header">
      <h2>Welcome back 👋</h2>
      <p>Sign in with your PRN to continue</p>
    </div>

    <!-- wallet connect hint -->
    <div class="wallet-connect-row">
      <span class="wc-icon">🦊</span>
      <div class="wc-text">
        <div class="wc-title">MetaMask Required</div>
        <div class="wc-sub">Make sure your wallet is connected before voting</div>
      </div>
      <button class="wallet-btn" onclick="connectWallet()">Connect</button>
    </div>

    <form id="signinForm">

      <div class="input-group">
        <label>PRN Number</label>
        <input type="text" id="signin-prn" placeholder="Enter your 14-digit PRN" maxlength="14" required/>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="signin-password" placeholder="Enter your password" required/>
      </div>

      <div class="forgot-link">
        <a href="#" onclick="forgotPassword(); return false;">Forgot password?</a>
      </div>

      <button type="submit" class="auth-btn">Sign In</button>

    </form>

    <div class="switch-link">
      Don't have an account? <a href="signup.html">Create one</a>
    </div>

    <div class="bharat-tag">🇮🇳 ChainSankalp &nbsp;|&nbsp; Secure Blockchain Voting</div>

  </div>

<script src="js/auth.js"></script>
</body>
</html>

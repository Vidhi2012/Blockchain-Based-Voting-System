<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voter Dashboard — ChainSankalp</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/voter_dashboard.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

<!-- ══════════ NAVBAR ══════════ -->
<header class="navbar">
  <a href="index.html" class="logo">⛓ ChainSankalp</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="vote.html" id="voteLink" class="nav-highlight" style="display:none">🗳️ Vote</a>
    <a href="voter_dashboard.html" class="nav-highlight">Dashboard</a>
    <button id="themeToggle" title="Toggle theme"></button>
    <a href="#" id="logoutBtn" onclick="logout()">Logout</a>
  </nav>
</header>

<div class="vd-wrapper">

  <!-- ══ TOP: voter info card ══ -->
  <div class="vd-top">

    <div class="vd-profile-card">
      <img id="voterImg" class="vd-avatar" src="" alt="Profile"/>
      <div class="vd-info">
        <div class="vd-name"    id="voterName">—</div>
        <div class="vd-prn"     id="voterPrn">PRN: —</div>
        <div class="vd-meta-row">
          <span class="vd-chip" id="voterDept">—</span>
          <span class="vd-chip" id="voterYear">—</span>
          <span class="vd-chip" id="voterGender">—</span>
        </div>
      </div>
      <div class="vd-vote-status" id="voteStatusWrap">
        <div class="vs-icon" id="vsIcon">🗳️</div>
        <div class="vs-label" id="vsLabel">Not Voted Yet</div>
      </div>
    </div>

    <!-- election status chips -->
    <div class="election-chips" id="electionChips"></div>

  </div>

  <!-- ══ CANDIDATE SECTIONS ══ -->
  <div class="vd-sections" id="vdSections"></div>

</div>

<script src="js/theme.js"></script>
<script src="js/app.js"></script>
<script src="js/voter_dashboard.js"></script>
</body>
</html>
